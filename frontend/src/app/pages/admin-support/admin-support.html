<div class="support-page">
  <div class="page-header">
    <h1>Support Requests</h1>
    <p>{{ requests.length }} request(s)</p>
  </div>

  <div *ngIf="loading" class="loading">Loading...</div>

  <div *ngIf="!loading && requests.length === 0" class="empty">
    <p>No support requests received.</p>
  </div>

  <div *ngIf="!loading && requests.length > 0" class="requests-list">
    <div *ngFor="let req of requests" class="request-card">
      <div class="req-header">
        <div class="req-user">
          <span class="user-name">{{ req.user_name || req.user_email }}</span>
          <span class="user-role badge" [class.admin]="req.user_role === 'admin'" [class.chef]="req.user_role === 'chef_equipe'">{{ req.user_role || 'User' }}</span>
        </div>
        <span class="req-date">{{ req.created_at | date:'dd/MM/yyyy HH:mm' }}</span>
      </div>
      <div class="req-body">
        <p>{{ req.motif }}</p>
      </div>
      <div class="req-footer">
        <span class="statut-badge" [class.pending]="req.statut === 'pending'" [class.approved]="req.statut === 'approved'">
          {{ req.statut }}
        </span>
      </div>
    </div>
  </div>
</div>
