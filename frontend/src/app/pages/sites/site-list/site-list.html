<div style="padding:2rem">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem">
    <div>
      <h1 style="font-size:1.5rem; color:#f8fafc; margin:0">{{ isAdmin() ? 'Site Management' : 'Sites' }}</h1>
      <p style="color:#94a3b8; font-size:13px; margin-top:4px">{{ sites.length }} site(s)</p>
    </div>
    <div style="display:flex; gap:8px">
      <a routerLink="/map"
        style="padding:8px 16px; background:rgba(34,197,94,0.2); color:#86efac; text-decoration:none; border-radius:8px; font-size:13px; font-weight:600; border:1px solid rgba(34,197,94,0.3); transition:all 0.2s">
        🗺️ Map
      </a>
      <a *ngIf="canCreateSites()" routerLink="/sites/new"
        style="padding:8px 16px; background:rgba(239,68,68,0.2); color:#fecaca; text-decoration:none; border-radius:8px; font-size:13px; font-weight:600; border:1px solid rgba(239,68,68,0.3); transition:all 0.2s">
        + Add Site
      </a>
    </div>
  </div>

  <div *ngIf="isChef()" style="background:rgba(148,163,184,0.1); padding:1rem; border-radius:8px; margin-bottom:1rem; color:#94a3b8; font-size:14px; border:1px solid rgba(148,163,184,0.12)">
    📍 Read-only view. Contact the administrator for any modifications.
  </div>

  <div *ngIf="loading" style="color:#e2e8f0; padding:2rem; text-align:center">Loading...</div>
  <div *ngIf="error" style="color:#fca5a5; padding:1rem; background:rgba(239,68,68,0.1); border-radius:8px; border:1px solid rgba(239,68,68,0.2)">{{ error }}</div>

  <div *ngIf="!loading && !error" style="background:rgba(15,23,42,0.9); border:1px solid rgba(148,163,184,0.15); border-radius:12px; overflow:hidden">
    <table style="margin:0; border:none; border-radius:0">
      <thead>
        <tr>
          <th>Name</th>
          <th>Address</th>
          <th>City</th>
          <th>Status</th>
          <th *ngIf="canEditSites() || canDeleteSites()">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let s of sites">
          <td style="font-weight:600; color:#f1f5f9">{{ s.nom }}</td>
          <td style="color:#cbd5e1">{{ s.adresse }}</td>
          <td style="color:#cbd5e1">{{ s.ville }}</td>
          <td>
            <span [style.background]="s.statut === 'actif' ? 'rgba(34,197,94,0.15)' : 'rgba(239,68,68,0.15)'"
                  [style.color]="s.statut === 'actif' ? '#86efac' : '#fca5a5'"
                  [style.border]="s.statut === 'actif' ? '1px solid rgba(34,197,94,0.3)' : '1px solid rgba(239,68,68,0.3)'"
                  style="padding:3px 10px; border-radius:12px; font-size:12px; font-weight:600">
              {{ s.statut }}
            </span>
          </td>
          <td *ngIf="canEditSites() || canDeleteSites()">
            <a *ngIf="canEditSites()" [routerLink]="['/sites/edit', s.id]"
              style="color:#ef4444; font-size:13px; margin-right:12px; text-decoration:none; font-weight:600">
              Edit
            </a>
            <button *ngIf="canDeleteSites()" (click)="delete(s.id)"
              style="color:#fca5a5; background:none; border:1px solid rgba(239,68,68,0.3); cursor:pointer; font-size:12px; padding:3px 10px; border-radius:6px; font-weight:600; transition:all 0.2s">
              Delete
            </button>
          </td>
        </tr>
        <tr *ngIf="sites.length === 0">
          <td [attr.colspan]="canEditSites() || canDeleteSites() ? 5 : 4"
            style="padding:2rem; text-align:center; color:#94a3b8; font-size:14px">
            No sites found
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
